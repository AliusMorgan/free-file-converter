<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free File Converter | Fast & Secure</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --ppt-color: #ea580c;
            --ppt-hover: #c2410c;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* تخطيط البطاقات */
        .tools-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tool-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.01);
        }

        .tool-card h3 {
            font-size: 1.05rem;
            margin-bottom: 12px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-box {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.2s ease;
            margin-bottom: 14px;
        }

        .file-box:hover {
            border-color: var(--primary-color);
            background-color: rgba(59, 130, 246, 0.04);
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            line-height: 1.4;
            word-break: break-all;
        }

        .file-label span {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: underline;
        }

        .convert-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .convert-btn:hover {
            background-color: var(--primary-hover);
        }

        .ppt-btn {
            background-color: var(--ppt-color);
        }
        .ppt-btn:hover {
            background-color: var(--ppt-hover);
        }

        .result-area {
            margin-top: 12px;
            text-align: center;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 11px;
            background-color: var(--success-color);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .download-btn:hover {
            opacity: 0.9;
        }

        .status-msg {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            padding: 16px;
            width: 100%;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 20px;
        }

        footer a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Document to PDF Converter</h1>
            <p>Fast, secure, server-side document processing tools.</p>
        </header>

        <div class="tools-grid">
            
            <!-- أداة تحويل الوورد إلى PDF -->
            <div class="tool-card">
                <h3>📄 Word to PDF (.docx)</h3>
                <form id="wordForm">
                    <div class="file-box" onclick="document.getElementById('wordInput').click()">
                        <p class="file-label" id="wordLabel">Upload Word file (.docx), or <span>browse</span></p>
                        <input type="file" id="wordInput" accept=".docx" required>
                    </div>
                    <button type="submit" class="convert-btn" id="wordBtn" style="display: none;">Convert Word to PDF</button>
                </form>
                <div class="result-area" id="wordResult"></div>
            </div>

            <!-- أداة تحويل الباوربوينت إلى PDF -->
            <div class="tool-card">
                <h3>📊 PowerPoint to PDF (.pptx)</h3>
                <form id="pptForm">
                    <div class="file-box" onclick="document.getElementById('pptInput').click()">
                        <p class="file-label" id="pptLabel">Upload PowerPoint file (.pptx), or <span>browse</span></p>
                        <input type="file" id="pptInput" accept=".pptx" required>
                    </div>
                    <button type="submit" class="convert-btn ppt-btn" id="pptBtn" style="display: none;">Convert PowerPoint to PDF</button>
                </form>
                <div class="result-area" id="pptResult"></div>
            </div>

        </div>

        <footer>
            <p>&copy; 2026 Cloud File Converter. All rights reserved.</p>
            <p style="margin-top: 6px;">
                <a href="#" onclick="alert('Privacy Policy: All uploaded files are automatically deleted immediately after conversion for your security.'); return false;">Privacy Policy</a> | 
                <a href="#" onclick="alert('Contact Us: You can reach out to the administrator via taegarubh@gmail.com'); return false;">Contact Us</a>
            </p>
        </footer>
    </div>

    <script>
        // معالجة ملفات الوورد
        const wordInput = document.getElementById('wordInput');
        const wordLabel = document.getElementById('wordLabel');
        const wordBtn = document.getElementById('wordBtn');
        const wordForm = document.getElementById('wordForm');
        const wordResult = document.getElementById('wordResult');

        wordInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                wordLabel.innerHTML = `Selected File: <strong>${e.target.files[0].name}</strong>`;
                wordBtn.style.display = 'block';
                wordResult.innerHTML = '';
            }
        });

        wordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!wordInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', wordInput.files[0]);

            wordResult.innerHTML = '<p class="status-msg">Processing Word file on secure server...</p>';

            try {
                const response = await fetch('/api/word-to-pdf', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Conversion failed');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const originalName = wordInput.files[0].name.substring(0, wordInput.files[0].name.lastIndexOf('.')) || 'document';
                const outputName = `${originalName}_converted.pdf`;

                wordResult.innerHTML = `
                    <a href="${url}" download="${outputName}" class="download-btn">
                        📥 Download Converted PDF
                    </a>
                `;
            } catch (err) {
                wordResult.innerHTML = '<p class="status-msg" style="color: var(--error-color);">An error occurred during processing.</p>';
            }
        });

        // معالجة ملفات الباوربوينت
        const pptInput = document.getElementById('pptInput');
        const pptLabel = document.getElementById('pptLabel');
        const pptBtn = document.getElementById('pptBtn');
        const pptForm = document.getElementById('pptForm');
        const pptResult = document.getElementById('pptResult');

        pptInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                pptLabel.innerHTML = `Selected File: <strong>${e.target.files[0].name}</strong>`;
                pptBtn.style.display = 'block';
                pptResult.innerHTML = '';
            }
        });

        pptForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!pptInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', pptInput.files[0]);

            pptResult.innerHTML = '<p class="status-msg">Processing PowerPoint file on secure server...</p>';

            try {
                const response = await fetch('/api/ppt-to-pdf', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Conversion failed');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const originalName = pptInput.files[0].name.substring(0, pptInput.files[0].name.lastIndexOf('.')) || 'presentation';
                const outputName = `${originalName}_converted.pdf`;

                pptResult.innerHTML = `
                    <a href="${url}" download="${outputName}" class="download-btn">
                        📥 Download Converted PDF
                    </a>
                `;
            } catch (err) {
                pptResult.innerHTML = '<p class="status-msg" style="color: var(--error-color);">An error occurred during processing.</p>';
            }
        });
    </script>
</body>
</html>
